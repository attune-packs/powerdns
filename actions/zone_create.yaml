ref: powerdns.zone_create
label: "Create PowerDNS Zone"
description: "Create a zone only when its exact name does not exist; never updates an existing zone"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: powerdns_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, description: "Attune Key containing PowerDNS API credentials", default: "powerdns.credentials", required: true}
  server_id: {type: string, description: "PowerDNS server ID", default: localhost, required: true}
  name: {type: string, description: "Absolute zone name ending with a dot", required: true}
  kind: {type: string, enum: [Native, Master, Slave, Producer, Consumer], default: Native}
  masters: {type: array, description: "Primary addresses for a Slave zone only", default: [], items: {type: string}}
  nameservers: {type: array, description: "Absolute nameserver names; omit for Slave zones", items: {type: string}}
  dnssec: {type: boolean, description: "Enable DNSSEC signing"}
  api_rectify: {type: boolean, description: "Automatically rectify after API changes"}
  soa_edit_api: {type: string, description: "PowerDNS SOA-EDIT-API policy used for serial updates"}
  account: {type: string, description: "Backend account metadata"}
  catalog: {type: string, description: "Catalog zone membership"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [powerdns, zone, create]
