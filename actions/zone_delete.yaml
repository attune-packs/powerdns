ref: powerdns.zone_delete
label: "Delete PowerDNS Zone"
description: "Delete a zone, all RRsets, and attached metadata after explicit ID and name confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: powerdns_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, description: "Attune Key containing PowerDNS API credentials", default: "pack.powerdns.credentials", required: true}
  server_id: {type: string, description: "PowerDNS server ID", default: localhost, required: true}
  zone_id: {type: string, description: "Opaque zone ID returned by PowerDNS", required: true}
  confirm_name: {type: string, description: "Exact absolute zone name which must match the server response", required: true}
  confirm: {type: boolean, description: "Must be true to authorize deletion", const: true, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [powerdns, zone, delete, destructive]
